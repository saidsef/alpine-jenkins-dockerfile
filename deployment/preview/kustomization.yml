apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base/
- ../nginx/

labels:
  - pairs:
      app.kubernetes.io/part-of: jenkins
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/version: merge
    includeSelectors: false
    includeTemplates: true

images:
- name: docker.io/saidsef/alpine-jenkins-dockerfile
  newName: docker.io/saidsef/alpine-jenkins-dockerfile
  newTag: merge


patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: preview.saidsef.co.uk
  target:
    kind: Ingress
    name: jenkins
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: docker.io/saidsef/alpine-jenkins-dockerfile:merge
  target:
    group: apps
    kind: StatefulSet
    name: jenkins
    version: v1

# Runs after the patch above, so it picks up the preview host, not the base one.
replacements:
- source:
    kind: Ingress
    name: jenkins
    fieldPath: spec.rules.0.host
  targets:
  - select:
      kind: StatefulSet
      name: jenkins
    fieldPaths:
    - spec.template.spec.containers.[name=jenkins].env.[name=JENKINS_HOSTNAME].value
